---
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      - name: Prepare Touch ID signing
        env:
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          CONFIG="$RUNNER_TEMP/hitsu-touch-id-signing/tauri.touch-id.conf.json"
          node scripts/prepare-macos-touch-id-signing.mjs "$(dirname "$CONFIG")"
          echo "TOUCH_ID_TAURI_CONFIG=$CONFIG" >> "$GITHUB_ENV"

      - name: Build
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm tauri build --config "$TOUCH_ID_TAURI_CONFIG"

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/dmg/*.dmg artifacts/ 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: artifacts/*

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm tauri build

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/deb/*.deb artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/rpm/*.rpm artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage artifacts/ 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: artifacts/*

  publish:
    runs-on: ubuntu-24.04
    needs: [build-macos, build-linux]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: macos/

      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: linux/

      - name: Generate release body
        run: |
          PREVIOUS_TAG=$(git tag --sort=-creatordate | grep '^v' | sed -n '2p')
          if [ -z "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" --extended-regexp --invert-grep \
              --grep='^[^(:]+\(ios\)!?:' HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" --extended-regexp --invert-grep \
              --grep='^[^(:]+\(ios\)!?:' "$PREVIOUS_TAG"..HEAD)
          fi
          {
            printf '%s\n' "## What's Changed"
            printf '\n%s\n' "$COMMITS"
            if [ -n "$PREVIOUS_TAG" ]; then
              printf '%s\n' "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREVIOUS_TAG...${{ github.ref_name }}"
            fi
          } > release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Collect asset paths
          ASSETS=()
          for f in macos/*.dmg linux/*.deb linux/*.rpm linux/*.AppImage; do
            [ -f "$f" ] && ASSETS+=("$f")
          done

          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No build artifacts found. Aborting publish."
            exit 1
          fi

          # Detect if this is a pre-release from the tag name
          PRERELEASE_FLAG=""
          case "${{ github.ref_name }}" in
            *-rc*|*-beta*|*-alpha*|*-pre*) PRERELEASE_FLAG="--prerelease" ;;
          esac

          gh release create "${{ github.ref_name }}" \
            --target="${{ github.sha }}" \
            --notes-file release-notes.md \
            $PRERELEASE_FLAG \
            "${ASSETS[@]}"
