---
name: Audit

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          cache-workspaces: src-tauri

      - name: Audit (cargo audit)
        run: |
          cargo install cargo-audit --locked
          cargo audit
        working-directory: src-tauri

  ios-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Check KDBXKit for a newer compatible version
        run: |
          resolved=ios/HitsuPasswordManager.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          pinned=$(jq -er '.pins[] | select(.identity == "kdbxkit") | .state.version' "$resolved")
          # Read all tags; GitHub's tag ordering is not semantic-version ordering.
          versions=$(git ls-remote --tags --refs https://github.com/shadone/KDBXKit.git \
            | jq -Rs 'split("\n") | map(split("\t")[1] // "")
              | map(sub("^refs/tags/v?"; ""))
              | map(select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$")))
              | unique | sort_by(split(".") | map(tonumber))')
          latest=$(jq -er 'last' <<< "$versions")
          compatible=$(jq -er --arg major "${pinned%%.*}" \
            'map(select(split(".")[0] == $major)) | last' <<< "$versions")
          echo "pinned=${pinned} compatible=${compatible} latest=${latest}"
          if [ "${latest%%.*}" -gt "${pinned%%.*}" ]; then
            echo "::warning::KDBXKit ${latest} is available; review its breaking changes separately."
          fi
          if [ "${pinned}" != "${compatible}" ]; then
            echo "::error::KDBXKit ${compatible} is available but the app pins ${pinned}."
            echo "::error::Review upstream changes (parser hardening) and bump the pin."
            exit 1
          fi
