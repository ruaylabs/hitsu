<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
		body { font-family: system-ui, sans-serif; padding: 1rem; }
		label { display: grid; gap: .25rem; margin-bottom: .75rem; font-weight: 650; }
		input { padding: .55rem; font: inherit; }
    </style>
  </head>
  <body>
    <form>
      <label>
        Email
        <input name="frame-email" type="email" autocomplete="username">
      </label>
      <label>
        Password
        <input name="frame-password" type="password" autocomplete="current-password">
      </label>
    </form>
  </body>
</html>
