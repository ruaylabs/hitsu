---
name: Audit

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          cache-workspaces: src-tauri

      - name: Audit (cargo audit)
        run: |
          cargo install cargo-audit --locked
          cargo audit
        working-directory: src-tauri

  ios-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Check KDBXKit for a newer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          resolved=ios/HitsuPasswordManager.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          pinned=$(jq -er '.pins[] | select(.identity == "kdbxkit") | .state.version' "$resolved")
          latest=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            'https://api.github.com/repos/shadone/KDBXKit/tags?per_page=1' \
            | jq -er '.[0].name')
          echo "pinned=${pinned} latest=${latest}"
          if [ "${pinned}" != "${latest#v}" ]; then
            echo "::error::KDBXKit ${latest} is available but the app pins ${pinned}."
            echo "::error::Review upstream changes (parser hardening) and bump the pin."
            exit 1
          fi

