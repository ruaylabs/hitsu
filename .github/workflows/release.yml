---
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      - name: Build
        env:
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/build-signed-macos.sh "$RUNNER_TEMP/hitsu-touch-id-signing" --release

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/dmg/*.dmg artifacts/ 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: artifacts/*

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm tauri build

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/deb/*.deb artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/rpm/*.rpm artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage artifacts/ 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: artifacts/*

  publish:
    runs-on: ubuntu-24.04
    needs: [build-macos, build-linux]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: macos/

      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: linux/

      - name: Generate release body
        run: |
          PREVIOUS_TAG=$(git tag --sort=-creatordate | grep '^v' | sed -n '2p')
          if [ -z "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" --extended-regexp --invert-grep \
              --grep='^[^(:]+\(ios\)!?:' HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" --extended-regexp --invert-grep \
              --grep='^[^(:]+\(ios\)!?:' "$PREVIOUS_TAG"..HEAD)
          fi
          {
            printf '%s\n' "## What's Changed"
            printf '\n%s\n' "$COMMITS"
            if [ -n "$PREVIOUS_TAG" ]; then
              printf '%s\n' "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREVIOUS_TAG...${{ github.ref_name }}"
            fi
          } > release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Collect asset paths
          ASSETS=()
          for f in macos/*.dmg linux/*.deb linux/*.rpm linux/*.AppImage; do
            [ -f "$f" ] && ASSETS+=("$f")
          done

          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No build artifacts found. Aborting publish."
            exit 1
          fi

          # Detect if this is a pre-release from the tag name
          PRERELEASE_FLAG=""
          case "${{ github.ref_name }}" in
            *-rc*|*-beta*|*-alpha*|*-pre*) PRERELEASE_FLAG="--prerelease" ;;
          esac

          gh release create "${{ github.ref_name }}" \
            --target="${{ github.sha }}" \
            --notes-file release-notes.md \
            $PRERELEASE_FLAG \
            "${ASSETS[@]}"

  update-nix-package:
    runs-on: ubuntu-24.04
    needs: publish
    permissions:
      contents: write
    concurrency:
      group: update-nix-package
      cancel-in-progress: false
    steps:
      - name: Check stable release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6.0.3
        if: steps.release.outputs.stable == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@v8
        if: steps.release.outputs.stable == 'true'
        with:
          name: linux
          path: ${{ runner.temp }}/hitsu-linux

      - name: Update package version and checksum
        if: steps.release.outputs.stable == 'true'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ARTIFACT_DIR: ${{ runner.temp }}/hitsu-linux
        run: python3 scripts/update-nix-package.py

      - uses: cachix/install-nix-action@v31
        if: steps.release.outputs.stable == 'true'
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Validate Nix package
        if: steps.release.outputs.stable == 'true'
        run: nix build .#default --no-link

      - name: Commit package update
        if: steps.release.outputs.stable == 'true'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- nix/package.nix; then
            echo "Nix package is already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nix/package.nix
          git commit -m "chore(nix): update package to ${RELEASE_TAG#v}"
          git push origin "HEAD:$DEFAULT_BRANCH"
